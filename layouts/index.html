{{ define "main" }}

<main aria-role="main">

  <div class="content">
    <div class="index-content framed">
      <h1 id="hello-there">{{.Site.Title}}</h1>
      <p>A chronological tour of the landmark deep-RL papers of the 2013&ndash;2019 era &mdash; from DQN on Atari to OpenAI Five &mdash; for novice researchers and hobbyists.</p>
      <div align="center">
        <a class="button" href="{{.Site.BaseURL}}/timeline">View</a>
        <a class="button" href="{{.Site.BaseURL}}/about">About</a>
      </div>

      <div class="video-container">
        <video src="{{.Site.Params.video}}" autoplay loop muted playsinline></video>
      </div>

    </div>
  </div>

</main>

{{ end }}
