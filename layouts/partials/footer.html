<footer class="footer">
    <div class="footer__inner">
        <div class="footer__content">
            <span>&copy; {{ now.Format "2006" }}</span>
            {{ with .Site.Params.author }}
                <span><a href="{{ $.Site.Params.authorURL }}">{{ . }}</a></span>
            {{ end }}
            {{ if .Site.Copyright }}
                <span>{{ .Site.Copyright| safeHTML }}</span>
            {{ end }}
        </div>
    </div>
</footer>
